[project]
name = "life_os_sheets"
version = "0.1.0"
description = "A short description of my project."
authors = [{ name = "Your Name", email = "your.email@example.com" }]
requires-python = ">=3.12" # <-- ИСПРАВЛЕНО: используем ~ вместо ~
dependencies = [
    "google-auth>=2.45.0",
    "gspread>=6.2.1",
    "pandas>=2.3.3",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.32.0",
    "socksio>=1.0.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.10.8",
    "httpx[socks]>=0.28.1",
]

[tool.uv]
# Configuration specific to uv can go here

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
addopts = "--strict-markers"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.commitizen]
name = "cz_conventional_commits"

[dependency-groups]
dev = [
    "black>=25.12.0",
    "commitizen>=4.11.0",
    "debugpy>=1.8.19",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]
